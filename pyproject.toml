[project]
name = "talking-agent"
version = "0.1.0"
description = "Backend голосового агента для практики разговорного английского"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "fastapi>=0.116,<1",
    "pydantic-settings>=2.10,<3",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.17,<2",
    "pytest>=8.3,<9",
    "ruff>=0.12,<1",
]

[project.scripts]
talking-agent = "talking_agent.main:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.mypy]
files = ["src"]
strict = true
